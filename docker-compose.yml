services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: hordefall
      MARIADB_USER: hordefall
      MARIADB_PASSWORD: devpassword
    ports: ["3306:3306"]
    volumes: ["mariadb-data:/var/lib/mysql"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  mariadb-data: