name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Bump Version & Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: 'feature/'
          patch_pattern: "fix:"
          default_bump: "patch"
          version_format: "${major}.${minor}.${patch}"

      - name: Set up JDK 27
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '27'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Jars with Version ${{ steps.semver.outputs.version }}
        run: ./gradlew build -Pversion=${{ steps.semver.outputs.version }}

      - name: Create Git Tag and Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.semver.outputs.version_tag }}
        run: |
          gh release create "$TAG_NAME" \
            game/build/libs/game-*.jar \
            lobby/build/libs/lobby-*.jar \
            proxy/build/libs/proxy-*.jar \
            --title "Release $TAG_NAME" \
            --generate-notes
